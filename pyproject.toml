[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lxd02"
version = "0.1.0"
description = "Driver, receipt/Markdown renderer and CLI for the LX-D02 Bluetooth LE thermal receipt printer"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE", "src/lxd02/assets/*LICENSE"]
authors = [{ name = "Arttu Mahlakaarto" }]
keywords = ["receipt printer", "bluetooth", "ble", "thermal printer", "markdown", "lx-d02"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: End Users/Desktop",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Printing",
]
dependencies = [
    "bleak>=0.22",
    "Pillow>=10.1.0",
    "qrcode>=7.4.2",
]

[project.urls]
Homepage = "https://github.com/amahlaka/LX-D02"
Issues = "https://github.com/amahlaka/LX-D02/issues"
Protocol = "https://github.com/amahlaka/LX-D02/blob/main/PROTOCOL.md"

[project.scripts]
lxd02-print = "lxd02.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lxd02 = ["assets/*"]
