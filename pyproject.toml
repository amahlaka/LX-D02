[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lxd02"
version = "0.1.0"
description = "Driver, receipt/Markdown renderer and CLI for the LX-D02 Bluetooth LE thermal receipt printer"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bleak>=0.22",
    "Pillow>=10.1.0",
    "qrcode>=7.4.2",
]

[project.scripts]
lxd02-print = "lxd02.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
lxd02 = ["assets/*"]
